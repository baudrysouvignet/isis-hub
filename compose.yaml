# Déploiement autonome avec Caddy (HTTPS) : `DOMAIN=hub.exemple.fr docker compose up -d --build`.
# Derrière un proxy inverse existant, utiliser plutôt compose.prod.yaml.
# Caddy obtient et renouvelle seul le certificat HTTPS (Let's Encrypt) pour DOMAIN.

services:
  hub:
    build:
      context: .
      args:
        VERSION: "2.1.1"
    image: isis-hub:2.1.1
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: "https://${DOMAIN:?définir DOMAIN, par ex. DOMAIN=hub.exemple.fr}"
      TRUST_PROXY: "1"
      # Identifiants universitaires administrateurs (vérifiés par le CAS) ; vide = pas d'administration.
      ADMIN_USERS: "${ADMIN_USERS:-}"
      VAULT_PEPPER: "${VAULT_PEPPER:-}"
      # Images du TCG dans Cloudflare R2 (facultatif ; sinon dans le volume hub_data).
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
    volumes:
      - hub_data:/data # les retours des étudiants, seule donnée conservée
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Le serveur n'écrit rien sur les visiteurs ; on ne garde même pas sa ligne de démarrage.
    logging:
      driver: none

  caddy:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: none

volumes:
  hub_data:
  caddy_data:
  caddy_config:
